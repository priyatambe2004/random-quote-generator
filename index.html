<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Random Quote Generator</h1>
      <p class="hint">Pick a category and get a new quote with one click.</p>
    </header>

    <div class="layout">
      <!-- Quote area -->
      <section class="main-col">
        <div class="chips" id="chips" role="group" aria-label="Quote category"></div>

        <figure class="quote-card" id="card" aria-live="polite">
          <span class="mark" aria-hidden="true">“</span>
          <blockquote id="quote" class="quote">Loading...</blockquote>
          <figcaption class="meta">
            <span id="author" class="author"></span>
            <span id="category" class="tag"></span>
          </figcaption>
        </figure>

        <div class="actions">
          <button type="button" id="new-quote" class="primary">New Quote</button>
          <button type="button" id="copy" class="secondary">📋 Copy</button>
          <button type="button" id="share" class="secondary">🔗 Share</button>
        </div>
        <p id="toast" class="toast" role="status"></p>
      </section>

      <!-- Recent quotes -->
      <aside class="side">
        <div class="side-head">
          <h2>Recently shown</h2>
          <span id="count" class="count"></span>
        </div>
        <ul id="recent-list"></ul>
        <p id="recent-empty" class="muted">Press “New Quote” to start.</p>
      </aside>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
